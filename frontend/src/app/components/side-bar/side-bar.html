<div class="drawer md:drawer-open">
  <input [(ngModel)]="isOpen" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content h-full box-border flex flex-col items-stretch">
    <div class="navbar bg-base-200 shadow-sm">
      <ng-content select="[navbar]"></ng-content>
    </div>
    <div class="grow p-2">

      <ng-content select="[content]"></ng-content>
    </div>
  </div>
  <div class="drawer-side">
    <label aria-label="close sidebar" class="drawer-overlay" (click)="close()"></label>
    <div class="menu bg-base-200 min-h-full w-80 p-4 rounded-e-box md:rounded-none md:border-r md:border-r-base-300 flex flex-col justify-stretch">
      <ng-content class="" select="[sidebar]"></ng-content>
    </div>
  </div>
</div>
