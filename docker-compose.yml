services:
  # Memopad it self
  app:
    build: .
    #container_name: memopad
    ports:
      - "8800:8080"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=memopad
      - PG_PASSWORD=memopad
      - PG_DATABASE=memopad
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=memopad
      - ES_PASSWORD=memopad
    depends_on:
      - postgres
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    command: -c 'max_connections=900'
    #container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: memopad
      POSTGRES_PASSWORD: memopad
      POSTGRES_DB: memopad
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memopad", "-d", "memopad"]
      interval: 10s
      timeout: 10s
